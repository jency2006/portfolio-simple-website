<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Young+Serif&display=swap" rel="stylesheet">
    <style>
        html,body{
            height: 100%;
        }
        *{
            overflow: hidden;
            margin: 0%;
            padding: 0%;
            font-family: "Young Serif", serif;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            background:linear-gradient(to bottom, rgb(172, 193, 49),rgb(149, 40, 200));
           
        }
        h2{
            text-align: center;
        }
            div{
                display: flex;
                justify-content: center;
                align-items: center;
                flex-direction: column;
                gap: 20px;
                border: 1px solid black;
                padding: 30px;
                background-color: aliceblue;
                border-radius: 10px;
            }
            button{
                width: 100%;
                border: none;
                background-color: rgb(173, 255, 47);
                padding: 6px;
                border-radius: 5px;
                cursor: pointer;
            }
            input{
                height: 25px;
                cursor: pointer;
                
            }
    </style>
</head>
<body>
   <div>
    <h2 >login</h2>
    <table>
        <tr><input id="user" type="text" placeholder=" username"></tr>
        <tr><input id="pass" type="password" placeholder=" passsword"></tr>
        <tr><button id="login">Submit</button></tr>
    </table>
   </div>
  <script>
  const username = document.getElementById("user");
  const password = document.getElementById("pass");
  const login = document.getElementById("login");

  login.addEventListener("click", function () {
    if (username.value === "jency2008" && password.value === "jencypasu") {
      window.location.href = "home.html";
    } else {
      alert("Incorrect username and password");
    }
  });
</script>
</body>
</html>
